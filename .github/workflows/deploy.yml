name: Deploy Backend to Server

# Конфігурація тригера
on:
  push:
    branches:
      - pod_test  # Пайплайн запускається тільки при push у гілку pod_test

jobs:
  # ----------------- ЕТАП 1: ТЕСТУВАННЯ -----------------
  test:
    name: 1. Run Tests
    runs-on: ubuntu-latest # Вказуємо, що завдання виконується на Ubuntu

    steps:
      # Крок 1: Отримуємо код з репозиторію
      - name: Checkout code
        uses: actions/checkout@v4

      # Крок 2: Налаштовуємо Node.js (v18 як приклад) та кешування npm
      - name: Use Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm' # Автоматично кешує node_modules

      # Крок 3: Встановлюємо залежності
      - name: Install dependencies
        run: npm install

      # Крок 4: Запускаємо тести
      - name: Run tests
        run: echo "Run tests" # Переконайтесь, що у вас є скрипт "test"

  # ----------------- ЕТАП 2: ВАЛІДАЦІЙНА ЗБІРКА -----------------
  build:
    name: 2. Build Project
    runs-on: ubuntu-latest
    needs: test # Це завдання почнеться тільки ПІСЛЯ успішного завершення 'test'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      # Виконуємо білд, щоб перевірити, що він проходить без помилок
      - name: Build project
        run: npm run build

  # ----------------- ЕТАП 3: РОЗГОРТАННЯ -----------------
  deploy:
    name: 3. Deploy to Server
    runs-on: ubuntu-latest
    needs: build # Це завдання почнеться тільки ПІСЛЯ успішного завершення 'build'

    steps:
      # Крок 1: Налаштовуємо SSH-агент з вашим приватним ключем
      # Це аналог вашої змінної типу "File"
      - name: Setup SSH Agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }} # Використовуємо GitHub Secret

      # Крок 2: Створюємо конфіг для SSH, щоб ігнорувати перевірку хоста
      - name: Create SSH config
        run: |
          mkdir -p ~/.ssh/
          chmod 700 ~/.ssh/
          echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config

      # Крок 3: Підключаємось до сервера і виконуємо скрипт деплою
      - name: Connect and deploy
        run: |
          ssh -p 52201 ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "
            cd ${{ secrets.DEPLOY_PATH }} &&
           
            echo 'Крок 1: Оновлення коду з репозиторію' &&
            # (РЕКОМЕНДАЦІЯ: Налаштуйте HTTPS+токен і видаліть 'eval' та 'ssh-add')
            eval \$(ssh-agent -s) &&
            ssh-add ~/.ssh/yevbober_rsa &&
            git fetch origin pod_test &&
            git checkout backend &&
            git reset --hard origin/pod_test &&

            Ось повний, виправлений та безпечний варіант пайплайну.

Щоб це запрацювало і файли більше ніколи не зникали, ми переходимо на стратегію Symlinks (Символічних посилань). Це означає, що ваші картинки фізично лежатимуть в окремій папці на сервері, а сайт просто "посилатиметься" на них.

⚠️ ВАЖЛИВО: Підготовка сервера (Зробити 1 раз руками)
Перед тим як пушити новий YAML файл, зайдіть на сервер через термінал і виконайте ці команди. Це перенесе ваші файли у безпечне місце:

Bash

# 1. Створюємо "сейф" для даних
mkdir -p /root/nova_poshta_data

# 2. Переміщуємо туди всі існуючі папки (якщо папка вже порожня/не існує, команда видасть помилку - це ок, ігноруйте)
mv /prod/nova_poshta_server/uploads /root/nova_poshta_data/
mv /prod/nova_poshta_server/uploads2 /root/nova_poshta_data/
mv /prod/nova_poshta_server/uploads3 /root/nova_poshta_data/
mv /prod/nova_poshta_server/uploads4 /root/nova_poshta_data/
mv /prod/nova_poshta_server/images /root/nova_poshta_data/
mv /prod/nova_poshta_server/doc /root/nova_poshta_data/
mv /prod/nova_poshta_server/uploads_gallerey /root/nova_poshta_data/
mv /prod/nova_poshta_server/uploads_gallerey2 /root/nova_poshta_data/
mv /prod/nova_poshta_server/uploadsold /root/nova_poshta_data/
mv /prod/nova_poshta_server/uploadspewold /root/nova_poshta_data/

# 3. Переміщуємо .env файл (конфігурацію теж краще тримати окремо)
mv /prod/nova_poshta_server/.env /root/nova_poshta_data/
Оновлений файл deploy.yml
Скопіюйте цей код повністю. Він більше не переміщує файли, а лише створює зв'язки.

YAML

name: Deploy Backend to Server

on:
  push:
    branches:
      - pod_test

jobs:
  # ----------------- ЕТАП 1: ТЕСТУВАННЯ -----------------
  test:
    name: 1. Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci # npm ci швидше і надійніше для CI/CD ніж install

      - name: Run tests
        run: echo "Run tests placeholder" 

  # ----------------- ЕТАП 2: ВАЛІДАЦІЙНА ЗБІРКА -----------------
  build:
    name: 2. Build Project
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

  # ----------------- ЕТАП 3: РОЗГОРТАННЯ (БЕЗПЕЧНЕ) -----------------
  deploy:
    name: 3. Deploy to Server
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Setup SSH Agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Create SSH config
        run: |
          mkdir -p ~/.ssh/
          chmod 700 ~/.ssh/
          echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config

      - name: Connect and Deploy
        run: |
          ssh -p 52201 ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "
            cd ${{ secrets.DEPLOY_PATH }} &&

            echo '🔹 Крок 1: Оновлення коду' &&
            # (Git commands preserved as per your setup)
            eval \$(ssh-agent -s) &&
            ssh-add ~/.ssh/yevbober_rsa &&
            git fetch origin pod_test &&
            git checkout backend &&
            git reset --hard origin/pod_test &&

            echo '🔹 Крок 2: Створення посилань на дані (Symlinks)' &&
            # Ця команда видаляє порожні папки, якщо Git їх створив, і замінює на посилання
            # Прапор -sfn: s=symlink, f=force (перезаписати), n=no-dereference (не лізти всередину)
            
            # Підключаємо .env файл
            ln -sfn /root/nova_poshta_data/.env .env &&
            
            # Підключаємо папки з картинками та документами
            rm -rf uploads uploads2 uploads3 uploads4 images doc uploads_gallerey uploads_gallerey2 uploadsold uploadspewold &&
            ln -sfn /root/nova_poshta_data/uploads uploads &&
            ln -sfn /root/nova_poshta_data/uploads2 uploads2 &&
            ln -sfn /root/nova_poshta_data/uploads3 uploads3 &&
            ln -sfn /root/nova_poshta_data/uploads4 uploads4 &&
            ln -sfn /root/nova_poshta_data/images images &&
            ln -sfn /root/nova_poshta_data/doc doc &&
            ln -sfn /root/nova_poshta_data/uploads_gallerey uploads_gallerey &&
            ln -sfn /root/nova_poshta_data/uploads_gallerey2 uploads_gallerey2 &&
            ln -sfn /root/nova_poshta_data/uploadsold uploadsold &&
            ln -sfn /root/nova_poshta_data/uploadspewold uploadspewold &&

            echo 'Крок 3: Встановлення залежностей, білд та перезапуск' &&
            npm install &&
            npm run build &&
            pm2 restart nova-poshta-backend &&
            sleep 5 &&
            pm2 describe nova-poshta-backend | grep -q 'status.*online'
          "

      # Крок 4: Надсилаємо сповіщення (Аналог after_script)
      # 'if: always()' гарантує, що цей крок виконається, навіть якщо попередній впав
      - name: Send Telegram notification
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            MESSAGE="✅ Deploy успішно завершено для *${{ github.event.repository.name }}* на гілці *${{ github.ref_name }}*%0AКоміт: [$(echo ${{ github.sha }} | cut -c1-8)](${{ github.event.repository.html_url }}/commit/${{ github.sha }})";
          else
            MESSAGE="❌ Помилка деплою для *${{ github.event.repository.name }}* на гілці *${{ github.ref_name }}*%0AКоміт: [$(echo ${{ github.sha }} | cut -c1-8)](${{ github.event.repository.html_url }}/commit/${{ github.sha }})";
          fi;
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
               -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
               -d "parse_mode=Markdown" \
               -d "text=${MESSAGE}"
