name: Deploy Backend to Server

# Конфігурація тригера
on:
  push:
    branches:
      - pod_test  # Пайплайн запускається тільки при push у гілку pod_test

jobs:
  # ----------------- ЕТАП 1: ТЕСТУВАННЯ -----------------
  test:
    name: 1. Run Tests
    runs-on: ubuntu-latest # Вказуємо, що завдання виконується на Ubuntu

    steps:
      # Крок 1: Отримуємо код з репозиторію
      - name: Checkout code
        uses: actions/checkout@v4

      # Крок 2: Налаштовуємо Node.js (v18 як приклад) та кешування npm
      - name: Use Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm' # Автоматично кешує node_modules

      # Крок 3: Встановлюємо залежності
      - name: Install dependencies
        run: npm install

      # Крок 4: Запускаємо тести
      - name: Run tests
        run: echo "Run tests" # Переконайтесь, що у вас є скрипт "test"

  # ----------------- ЕТАП 2: ВАЛІДАЦІЙНА ЗБІРКА -----------------
  build:
    name: 2. Build Project
    runs-on: ubuntu-latest
    needs: test # Це завдання почнеться тільки ПІСЛЯ успішного завершення 'test'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      # Виконуємо білд, щоб перевірити, що він проходить без помилок
      - name: Build project
        run: npm run build

  # ----------------- ЕТАП 3: РОЗГОРТАННЯ -----------------
  deploy:
    name: 3. Deploy to Server
    runs-on: ubuntu-latest
    needs: build # Це завдання почнеться тільки ПІСЛЯ успішного завершення 'build'

    steps:
      # Крок 1: Налаштовуємо SSH-агент з вашим приватним ключем
      # Це аналог вашої змінної типу "File"
      - name: Setup SSH Agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }} # Використовуємо GitHub Secret

      # Крок 2: Створюємо конфіг для SSH, щоб ігнорувати перевірку хоста
      - name: Create SSH config
        run: |
          mkdir -p ~/.ssh/
          chmod 700 ~/.ssh/
          echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config

      # Крок 3: Підключаємось до сервера і виконуємо скрипт деплою
      - name: Connect and deploy
        run: |
          ssh -p 52201 ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "
            cd ${{ secrets.DEPLOY_PATH }} &&
            echo 'Крок 1: Тимчасово переміщуємо файли, які потрібно зберегти' &&
            mkdir -p .tmp_deploy &&
            mv .env .tmp_deploy/ || true &&
            mv uploads .tmp_deploy/ || true &&
            mv doc .tmp_deploy/ || true &&

            echo 'Крок 2: Оновлення коду з репозиторію' &&
            eval \$(ssh-agent -s) &&
            ssh-add ~/.ssh/yevbober_rsa &&
            git fetch origin pod_test &&
            git checkout backend &&
            git reset --hard origin/pod_test &&

            echo 'Крок 3: Повертаємо збережені файли' &&
            rm -rf ./uploads ./doc ./.env &&
            mv .tmp_deploy/.env . || true &&
            mv .tmp_deploy/uploads . || true &&
            mv .tmp_deploy/doc . || true &&
            rm -rf .tmp_deploy &&

            echo 'Крок 4: Встановлення залежностей, білд та перезапуск' &&
            npm install &&
            npm run build &&
            pm2 restart nova-poshta-backend &&
            sleep 5 &&
            pm2 describe nova-poshta-backend | grep -q 'status.*online'
          "

      # Крок 4: Надсилаємо сповіщення (Аналог after_script)
      # 'if: always()' гарантує, що цей крок виконається, навіть якщо попередній впав
      - name: Send Telegram notification
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            MESSAGE="✅ Deploy успішно завершено для *${{ github.event.repository.name }}* на гілці *${{ github.ref_name }}*%0AКоміт: [$(echo ${{ github.sha }} | cut -c1-8)](${{ github.event.repository.html_url }}/commit/${{ github.sha }})";
          else
            MESSAGE="❌ Помилка деплою для *${{ github.event.repository.name }}* на гілці *${{ github.ref_name }}*%0AКоміт: [$(echo ${{ github.sha }} | cut -c1-8)](${{ github.event.repository.html_url }}/commit/${{ github.sha }})";
          fi;
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
               -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
               -d "parse_mode=Markdown" \
               -d "text=${MESSAGE}"
